[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accounting-report"
version = "1.2.0"
description = "Validated Excel to Word accounting report automation"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1,<4", "lxml>=5,<7"]

[project.optional-dependencies]
templates = ["python-docx>=1.1,<2"]

[project.scripts]
accounting-report = "accounting_report.cli:main"

[tool.setuptools.packages.find]
include = ["accounting_report*"]

[tool.setuptools.package-data]
accounting_report = ["web/*.html", "web/*.css", "web/*.js"]
